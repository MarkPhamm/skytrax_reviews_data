<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skytrax Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.5/index.css"
    integrity="sha384-ZTIcl2CmY0wyM9ANOhomBco7rEUIlWztf6lGcLKCocKUrIgGCsfisuZyE+hadW8K" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/basecoat.cdn.min.css"
    integrity="sha384-XWKdrxzE2X33lI8Q03C9fIbqdLWV11whVNycR2/3bMNJY73EEQOa7rmN+SeiSCor" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/js/all.min.js"
    integrity="sha384-rD2ZCuReXV7nIneJcn1lsTn6yOv87YARLQyUsemVAxrYYHdy5hcAW8XZEQxx87Dj" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
    integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD" crossorigin="anonymous"></script>
  <style>
    /* anfra tokens (DESIGN.md) on Basecoat's variables. Light is from DESIGN.md; the dark values
       are derived from it, since DESIGN.md only lists the light theme. */
    :root {
      --background: oklch(0.955 0.007 88.6);          /* paper: the page */
      --foreground: oklch(0.201 0.022 301.1);         /* ink */
      --card: oklch(1 0 0);                           /* white: panels */
      --card-foreground: oklch(0.201 0.022 301.1);
      --popover: oklch(1 0 0);
      --popover-foreground: oklch(0.201 0.022 301.1);
      --primary: oklch(0.565 0.194 300.3);            /* the one violet */
      --primary-foreground: oklch(1 0 0);
      --secondary: oklch(0.973 0.005 95.1);           /* sunken paper */
      --secondary-foreground: oklch(0.392 0.021 304.3);
      --muted: oklch(0.973 0.005 95.1);
      --muted-foreground: oklch(0.485 0.022 306.3);
      --accent: oklch(0.946 0.027 304.8);             /* violet wash: hover, selected */
      --accent-foreground: oklch(0.201 0.022 301.1);
      --border: oklch(0.201 0.022 301.1 / 0.12);
      --input: oklch(0.201 0.022 301.1 / 0.22);
      --ring: oklch(0.565 0.194 300.3);
      --radius: 0.625rem;
      /* ECharts cannot parse oklch, so chart colors are hex. Violet first, fixed order. */
      --chart-text: #5b5560;
      --chart-grid: #e7e4e0;
      --chart-cat-1: #7c4dce; --chart-cat-2: #1f9aa6; --chart-cat-3: #d9972b; --chart-cat-4: #d4527a;
      --chart-cat-5: #3d7bd9; --chart-cat-6: #3f9d6b; --chart-cat-7: #dd7a3c; --chart-cat-8: #7d7785;
    }
    .dark {
      --background: oklch(0.17 0.015 301);
      --foreground: oklch(0.961 0.007 304.2);
      --card: oklch(0.215 0.017 301);
      --card-foreground: oklch(0.961 0.007 304.2);
      --popover: oklch(0.245 0.018 301);
      --popover-foreground: oklch(0.961 0.007 304.2);
      --primary: oklch(0.7 0.16 300);
      --primary-foreground: oklch(0.17 0.015 301);
      --secondary: oklch(0.26 0.018 301);
      --secondary-foreground: oklch(0.86 0.01 304);
      --muted: oklch(0.26 0.018 301);
      --muted-foreground: oklch(0.72 0.02 304);
      --accent: oklch(0.32 0.05 301);
      --accent-foreground: oklch(0.961 0.007 304.2);
      --border: oklch(1 0 0 / 0.1);
      --input: oklch(1 0 0 / 0.16);
      --ring: oklch(0.7 0.16 300);
      --chart-text: #b4aebb;
      --chart-grid: #38333d;
      --chart-cat-1: #a98af0; --chart-cat-2: #4cc3cf; --chart-cat-3: #f0b252; --chart-cat-4: #f07ea0;
      --chart-cat-5: #7aa8f2; --chart-cat-6: #6cc496; --chart-cat-7: #f59a63; --chart-cat-8: #a39dab;
    }

    /* Three sizes only (20, 14, 12px), one control height (32px), tabular numerals. */
    body {
      font: 14px/20px "Inter Variable", Inter, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      background: var(--background); color: var(--foreground);
      margin: 0; padding: 24px; max-width: 1280px; margin-inline: auto;
    }
    h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 0; text-wrap: balance; }
    .caption { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
    .header { margin-bottom: 16px; }
    .btn, .input { height: 32px; font-size: 14px; }
    .card { border-radius: 14px; box-shadow: none; position: relative; }
    .card > header { padding-bottom: 0; }
    .card h2 { font-size: 14px; line-height: 20px; font-weight: 600; }

    /* Filter bar: one row, wraps on narrow screens. */
    /* Basecoat's .card is a clipped column: make the bar a row and let combobox dropdowns overflow. */
    .card.filters { flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: flex-end;
                    justify-content: flex-start; padding: 12px 16px; margin-bottom: 16px;
                    overflow: visible; }
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-group > label { font-weight: 500; }
    .date-range { display: flex; align-items: center; gap: 8px; }
    .date-range .input { width: 9.5rem; }
    .presets { display: flex; gap: 4px; }
    .spacer { flex: 1; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .chart { height: 420px; }
    .status { position: absolute; inset: 56px 16px 16px; display: none; align-items: center;
              justify-content: center; background: color-mix(in oklab, var(--card) 85%, transparent); }
    .status.visible { display: flex; }
    .status > * { width: 100%; }
    .status .skeleton { height: 100%; border-radius: 10px; }
    .status .empty { text-align: center; color: var(--muted-foreground); }

    /* KPI row: picked airline/airport (big) vs the rest (small). */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { padding: 16px; gap: 4px; }
    .kpi .value { font-size: 20px; line-height: 28px; font-weight: 600; }
    .kpi .rest { display: flex; justify-content: space-between; gap: 8px; }
    .delta.up { color: #3f9d6b; }
    .delta.down { color: #d4527a; }
    .legend { display: flex; gap: 16px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    /* Basecoat's outline buttons read as "selected" in a group; mark the pressed one explicitly. */
    .button-group [aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
    .tabs-bar { margin-bottom: 16px; }
    .page[hidden], .field-group[hidden] { display: none; }

    /* One section per metric: a heading with the comparison, then two charts side by side. */
    .metric-section { margin-bottom: 16px; }
    .metric-section > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
    .metric-section .grid { grid-template-columns: 1fr 1fr; }
    @media (max-width: 800px) { .metric-section .grid { grid-template-columns: 1fr; } }
    .metric-section .chart { height: 300px; }
    .metric-section .grid > div { min-width: 0; } /* let charts shrink with the column */
    .chart-title { font-size: 12px; line-height: 16px; color: var(--muted-foreground); margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Skytrax: one airline or airport vs the rest</h1>
    <div class="caption">Ratings are 1-5 averages over the reviews that filled them in. "Rest" is every other airline (or airport) combined, in the same review type.</div>
  </div>

  <div class="tabs-bar" data-anfra-container="tabs" data-anfra-label="Pages">
    <div class="button-group" role="group" aria-label="Review type" id="tabs"></div>
  </div>

  <div class="card filters" data-anfra-container="controls" data-anfra-label="Controls">
    <div class="field-group" id="airline-group" data-anfra-block="airline-picker" data-anfra-label="Airline">
      <label for="airline-input">Airline</label>
      <div id="airline-combobox" class="combobox" style="width: 260px" data-auto-highlight="true">
        <input id="airline-input" type="text" role="combobox" placeholder="Pick an airline" autocomplete="off"
               autocorrect="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"
               aria-controls="airline-listbox">
        <div data-popover aria-hidden="true">
          <div role="listbox" id="airline-listbox" aria-orientation="vertical" data-empty="No airlines found."></div>
        </div>
        <input type="hidden" name="airline" value="">
      </div>
    </div>

    <div class="field-group" id="airport-group" data-anfra-block="airport-picker" data-anfra-label="Airport" hidden>
      <label for="airport-input">Airport</label>
      <div id="airport-combobox" class="combobox" style="width: 260px" data-auto-highlight="true">
        <input id="airport-input" type="text" role="combobox" placeholder="Pick an airport" autocomplete="off"
               autocorrect="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"
               aria-controls="airport-listbox">
        <div data-popover aria-hidden="true">
          <div role="listbox" id="airport-listbox" aria-orientation="vertical" data-empty="No airports found."></div>
        </div>
        <input type="hidden" name="airport" value="">
      </div>
    </div>

    <div class="field-group" data-anfra-block="traveller-picker" data-anfra-label="Type of traveller">
      <label for="traveller-input">Type of traveller</label>
      <div id="traveller-combobox" class="combobox" style="width: 220px" data-auto-highlight="true">
        <input id="traveller-input" type="text" role="combobox" placeholder="All travellers" autocomplete="off"
               autocorrect="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false"
               aria-controls="traveller-listbox">
        <div data-popover aria-hidden="true">
          <div role="listbox" id="traveller-listbox" aria-orientation="vertical" aria-multiselectable="true"
               data-empty="No traveller types found."></div>
        </div>
        <input type="hidden" name="traveller" value="[]">
      </div>
    </div>

    <div class="field-group" data-anfra-block="date-picker" data-anfra-label="Date submitted" data-anfra-control="airline_dates airport_dates seat_dates lounge_dates">
      <label for="date-from">Date submitted</label>
      <div class="date-range">
        <input id="date-from" class="input" type="date" aria-label="From">
        <span class="caption">to</span>
        <input id="date-to" class="input" type="date" aria-label="To">
      </div>
    </div>

    <div class="field-group">
      <span class="caption">Quick range</span>
      <div class="presets">
        <button class="btn" data-variant="outline" type="button" data-years="1">1y</button>
        <button class="btn" data-variant="outline" type="button" data-years="3">3y</button>
        <button class="btn" data-variant="outline" type="button" data-years="5">5y</button>
        <button class="btn" data-variant="ghost" type="button" data-years="all">All</button>
      </div>
    </div>

    <div class="field-group" data-anfra-block="grain-picker" data-anfra-label="Trend grain" data-anfra-control="grain">
      <span class="caption">Trend grain</span>
      <div class="button-group" role="group" aria-label="Date grain">
        <button class="btn" data-variant="outline" type="button" data-grain="month">Month</button>
        <button class="btn" data-variant="secondary" type="button" data-grain="quarter" aria-pressed="true">Quarter</button>
        <button class="btn" data-variant="outline" type="button" data-grain="year">Year</button>
      </div>
    </div>
  </div>

  <div id="pages"></div>

  <script>
    // ---- Design layer: follow the OS light/dark setting (no storage: the frame is sandboxed). ----
    const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    const applyTheme = () => document.documentElement.classList.toggle('dark', darkQuery.matches);
    applyTheme();

    function chartTheme () {
      const css = getComputedStyle(document.documentElement);
      const get = (name) => css.getPropertyValue(name).trim();
      return {
        text: get('--chart-text'),
        grid: get('--chart-grid'),
        cat: [1, 2, 3, 4, 5, 6, 7, 8].map((n) => get(`--chart-cat-${n}`)),
      };
    }

    // ---- Page config: one tab per fact. `group` is which picker drives the comparison. ----
    const BASE_KPIS = [
      ['reviews', 'review_count', 'Reviews', 'count'],
      ['avg_rating', 'avg_rating', 'Avg rating', 'rating'],
      ['recommend_rate', 'recommend_rate', '% recommended', 'pct'],
    ];
    const PAGES = [
      {
        key: 'airline', label: 'Airline reviews', dataset: 'airline_reviews', fact: 'fct_airline_review',
        group: 'airline', entityField: 'dim_airline.airline_name',
        ratings: [['avg_value_for_money', 'Value for money'], ['avg_seat_comfort', 'Seat comfort'],
          ['avg_cabin_staff_service', 'Cabin staff'], ['avg_food_and_beverages', 'Food & beverages'], ['avg_ground_service', 'Ground service']],
      },
      {
        key: 'airport', label: 'Airport reviews', dataset: 'airport_reviews', fact: 'fct_airport_review',
        group: 'airport', entityField: 'dim_airport.airport_name',
        ratings: [['avg_queuing_times', 'Queuing times'], ['avg_terminal_cleanliness', 'Terminal cleanliness'],
          ['avg_terminal_signs', 'Terminal signs'], ['avg_airport_shopping', 'Shopping'], ['avg_airport_staff', 'Airport staff']],
      },
      {
        key: 'seat', label: 'Seat reviews', dataset: 'seat_reviews', fact: 'fct_seat_review',
        group: 'airline', entityField: 'dim_airline.airline_name',
        ratings: [['avg_seat_legroom', 'Legroom'], ['avg_seat_recline', 'Recline'], ['avg_seat_width', 'Seat width'],
          ['avg_aisle_space', 'Aisle space'], ['avg_viewing_tv_screen', 'TV screen']],
      },
      {
        key: 'lounge', label: 'Lounge reviews', dataset: 'lounge_reviews', fact: 'fct_lounge_review',
        group: 'airline', entityField: 'dim_airline.airline_name',
        ratings: [['avg_comfort', 'Comfort'], ['avg_cleanliness', 'Cleanliness'], ['avg_bar_and_beverages', 'Bar & beverages'],
          ['avg_catering', 'Catering'], ['avg_staff_service', 'Staff service']],
      },
    ];
    const DEFAULTS = { airline: 'british airways', airport: 'london heathrow' };
    const NOUN = { airline: 'airlines', airport: 'airports' };

    // ---- SDK wiring ----
    const app = Anfra.createApp({ title: 'Skytrax Dashboard' });
    const grain = app.createDateDrill('grain', { default: 'quarter' });
    const picked = { ...DEFAULTS };
    const groupFilters = { airline: [], airport: [] }; // [pickFilter, restFilter] pairs per picker
    const travellerFilters = [];
    const dateFilters = [];

    for (const page of PAGES) {
      const f = (name) => `${page.fact}.${name}`;
      page.kpis = [
        ...BASE_KPIS.map(([alias, field, label, kind]) => [alias, f(field), label, kind]),
        ...page.ratings.map(([field, label]) => [field, f(field), label, 'rating']),
      ];
      // Sections: avg rating, % recommended, each sub-rating, then review volume last.
      page.sections = [...page.kpis.filter(([alias]) => alias !== 'reviews'), page.kpis[0]];
      // Every query returns every metric, so one query feeds all the sections of a page.
      const measures = page.kpis.map(([alias, field]) => `${alias}: ${field}`).join(', ');
      const kpiAql = `explore { measures { ${measures} } }`;
      const trendAql = `explore {
        dimensions { period: ${f('date_submitted')} }
        measures { ${measures} }
        sorts { period asc }
      }`;
      const q = (name, aql, opts = {}) => app.createQuery(`${page.key}_${name}`, { dataset: page.dataset, aql, ...opts });
      page.kpiPick = q('kpiPick', kpiAql);
      page.kpiRest = q('kpiRest', kpiAql);
      page.trendPick = q('trendPick', trendAql);
      page.trendRest = q('trendRest', trendAql);
      // pageSize 15 + sort by reviews: the 15 most-reviewed airlines/airports.
      page.top = q('top', `explore {
        dimensions { name: ${page.entityField} }
        measures { ${measures} }
        sorts { reviews desc }
      }`, { pageSize: 15 });
      page.queries = [page.kpiPick, page.kpiRest, page.trendPick, page.trendRest, page.top];

      const def = DEFAULTS[page.group];
      const pick = app.createFilter(`${page.key}_pick`, { dataset: page.dataset, field: page.entityField, default: { operator: 'is', values: [def] } });
      const rest = app.createFilter(`${page.key}_rest`, { dataset: page.dataset, field: page.entityField, default: { operator: 'is_not', values: [def] } });
      const traveller = app.createFilter(`${page.key}_traveller`, { dataset: page.dataset, field: f('type_of_traveller') });
      const dates = app.createFilter(`${page.key}_dates`, { dataset: page.dataset, field: f('date_submitted') });
      page.pickFilter = pick;
      groupFilters[page.group].push([pick, rest]);
      travellerFilters.push(traveller);
      dateFilters.push(dates);

      for (const query of [page.kpiPick, page.trendPick]) app.mapControl(pick, query, { field: page.entityField });
      for (const query of [page.kpiRest, page.trendRest]) app.mapControl(rest, query, { field: page.entityField });
      for (const query of page.queries) {
        app.mapControl(traveller, query, { field: f('type_of_traveller') });
        app.mapControl(dates, query, { field: f('date_submitted') });
      }
      app.mapControl(grain, page.trendPick, { field: f('date_submitted') });
      app.mapControl(grain, page.trendRest, { field: f('date_submitted') });
    }

    function setEntity (group, name) {
      picked[group] = name;
      for (const [pick, rest] of groupFilters[group]) {
        pick.setCondition({ operator: 'is', values: [name] });
        rest.setCondition({ operator: 'is_not', values: [name] });
      }
      app.execute();
    }

    // ---- Page markup, built from the config ----
    const pagesEl = document.getElementById('pages');
    const tabsEl = document.getElementById('tabs');
    for (const page of PAGES) {
      const k = page.key;
      const noun = NOUN[page.group];
      const section = document.createElement('div');
      section.className = 'page';
      section.id = `page-${k}`;
      section.dataset.anfraContainer = `page-${k}`;
      section.dataset.anfraLabel = page.label;
      section.innerHTML = `<div class="kpis" data-anfra-container="${k}-kpis" data-anfra-label="Summary"></div>` +
        page.sections.map(([alias, , label]) => `
          <section class="card metric-section" data-anfra-block="${k}-${alias}" data-anfra-label="${page.label}: ${label}"
                   data-anfra-query="${k}_top ${k}_trendPick ${k}_trendRest">
            <header><h2>${label}</h2><span class="caption" data-summary="${alias}"></span></header>
            <section class="grid">
              <div>
                <div class="chart-title">${alias === 'reviews' ? `15 most-reviewed ${noun}` : `15 most-reviewed ${noun}, ranked. Dashed line: rest of ${noun}`}</div>
                <div class="chart" data-chart="top" data-alias="${alias}"></div>
              </div>
              <div>
                <div class="chart-title">${alias === 'reviews' ? 'Reviews over time (bars) and share of all reviews (line)' : `Over time: <span class="legend-pick"></span> (solid) vs rest of ${noun} (dashed)`}</div>
                <div class="chart" data-chart="trend" data-alias="${alias}"></div>
              </div>
            </section>
            <div class="status"></div>
          </section>`).join('');
      pagesEl.append(section);
      page.el = section;
      page.charts = null; // created the first time the tab is shown, when the charts have a size

      const tab = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', textContent: page.label });
      tab.dataset.page = k;
      tab.addEventListener('click', () => showPage(k));
      tabsEl.append(tab);
    }

    function initCharts (page) {
      page.charts = [...page.el.querySelectorAll('[data-chart]')].map((el) => {
        const chart = echarts.init(el);
        if (el.dataset.chart === 'top') {
          chart.on('click', (params) => {
            const name = params.name;
            pickers[page.group].box.setValue?.(name);
            setEntity(page.group, name);
          });
        }
        return { el, chart, kind: el.dataset.chart, alias: el.dataset.alias };
      });
    }

    let current = PAGES[0].key;
    const currentPage = () => PAGES.find((p) => p.key === current);
    function showPage (key) {
      current = key;
      const page = currentPage();
      for (const p of PAGES) p.el.hidden = p.key !== key;
      tabsEl.querySelectorAll('[data-page]').forEach((tab) => {
        const on = tab.dataset.page === key;
        tab.dataset.variant = on ? 'secondary' : 'outline';
        tab.setAttribute('aria-pressed', String(on));
      });
      document.getElementById('airline-group').hidden = page.group !== 'airline';
      document.getElementById('airport-group').hidden = page.group !== 'airport';
      if (!page.charts) initCharts(page);
      page.charts.forEach(({ chart }) => chart.resize());
      render();
    }

    // ---- Rendering ----
    const fmt = {
      count: new Intl.NumberFormat(),
      rating: new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      pct: new Intl.NumberFormat(undefined, { style: 'percent', maximumFractionDigits: 1 }),
    };
    const signed = new Intl.NumberFormat(undefined, { signDisplay: 'exceptZero', minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const signedPp = new Intl.NumberFormat(undefined, { signDisplay: 'exceptZero', maximumFractionDigits: 1 });
    const show = (value, kind) => (value == null ? 'n/a' : fmt[kind].format(value));
    const num = (v) => (v == null ? null : Number(v)); // numbers arrive as strings; Number(null) would be 0
    const logged = new Set();

    // The four states of the queries behind an element: loading, error, no rows, success (hidden).
    function renderStatus (queries, el) {
      el.replaceChildren();
      const failed = queries.find((query) => query.state === 'error');
      if (failed) {
        const alert = Object.assign(document.createElement('div'), { className: 'alert' });
        alert.dataset.variant = 'destructive';
        const title = document.createElement('h2');
        title.textContent = "Couldn't load this section";
        const detail = document.createElement('section');
        detail.textContent = failed.error.message;
        alert.append(title, detail);
        el.append(alert);
      } else if (queries.some((query) => query.state === 'executing' && !query.result)) {
        el.append(Object.assign(document.createElement('div'), { className: 'skeleton' }));
      } else if (queries.every((query) => query.state === 'success' && query.result.rows.length === 0)) {
        el.append(Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No reviews for these filters' }));
      }
      el.classList.toggle('visible', el.childElementCount > 0);
    }

    function logFirstResult (query) {
      if (query.state !== 'success' || logged.has(query.name)) return;
      logged.add(query.name);
      console.log(query.name, 'first row', query.result.rows[0], 'executed AQL', query.result.debug?.executedAql);
    }

    function axisStyle (theme) {
      return {
        axisLabel: { color: theme.text },
        axisLine: { lineStyle: { color: theme.grid } },
        splitLine: { lineStyle: { color: theme.grid } },
      };
    }

    // Gap to the rest: points for ratings, percentage points for %, share of all reviews for counts.
    function deltaText (kind, mine, rest) {
      if (mine == null || rest == null) return ['', ''];
      if (kind === 'count') return [`${fmt.pct.format(mine / (mine + rest))} of reviews`, ''];
      const diff = mine - rest;
      const text = kind === 'pct' ? `${signedPp.format(diff * 100)} pp` : signed.format(diff);
      return [text, diff > 0 ? 'up' : diff < 0 ? 'down' : ''];
    }

    function renderKpis (page, mineRow, restRow) {
      const loading = !page.kpiPick.result && page.kpiPick.state === 'executing';
      const error = [page.kpiPick, page.kpiRest].find((query) => query.state === 'error');
      page.el.querySelector('.kpis').replaceChildren(...page.kpis.map(([alias, , label, kind]) => {
        const mine = num(mineRow[alias]);
        const rest = num(restRow[alias]);
        const [text, dir] = deltaText(kind, mine, rest);
        const card = document.createElement('div');
        card.className = 'card kpi';
        card.dataset.anfraBlock = `${page.key}-kpi-${alias}`;
        card.dataset.anfraLabel = label;
        card.dataset.anfraQuery = `${page.key}_kpiPick ${page.key}_kpiRest`;
        card.innerHTML = `
          <div class="caption"></div>
          <div class="value"></div>
          <div class="rest caption"><span class="rest-value"></span><span class="delta ${dir}"></span></div>`;
        card.querySelector('.caption').textContent = label;
        card.querySelector('.value').textContent = error ? 'Error' : loading ? '...' : show(mine, kind);
        card.querySelector('.rest-value').textContent = `Rest ${show(rest, kind)}`;
        card.querySelector('.delta').textContent = text;
        if (error) card.title = error.error.message;
        return card;
      }));
    }

    // Left chart: the top 15 on this metric, picked one highlighted, the rest's value as a dashed line.
    function topOption (page, alias, kind, restValue, theme, name) {
      const rows = (page.top.result?.rows ?? [])
        .filter((row) => row[alias] != null)
        .sort((a, b) => Number(a[alias]) - Number(b[alias])); // ascending: the best ends up on top
      const pickColor = theme.cat[0];
      const restColor = theme.cat[7];
      const valueAxis = kind === 'rating' ? { min: 0, max: 5 } : kind === 'pct' ? { min: 0, max: 1 } : {};
      return {
        animation: false,
        textStyle: { color: theme.text },
        grid: { left: 8, right: 24, top: 24, bottom: 8, containLabel: true }, // top room for the rest line's label
        tooltip: { formatter: (p) => `${p.name}<br>${show(p.value, kind)}` },
        yAxis: { type: 'category', data: rows.map((row) => row.name), ...axisStyle(theme), axisLabel: { color: theme.text, fontSize: 11 } },
        xAxis: { type: 'value', ...valueAxis, axisLabel: { color: theme.text, formatter: (v) => show(v, kind) }, splitLine: axisStyle(theme).splitLine },
        series: [{
          type: 'bar',
          itemStyle: { borderRadius: [0, 4, 4, 0] },
          data: rows.map((row) => ({
            value: Number(row[alias]),
            itemStyle: { color: row.name === name ? pickColor : restColor, opacity: row.name === name ? 1 : 0.45 },
          })),
          markLine: kind === 'count' || restValue == null ? undefined : {
            symbol: 'none', silent: true,
            lineStyle: { color: theme.text, type: 'dashed' },
            label: { formatter: `Rest ${show(restValue, kind)}`, color: theme.text },
            data: [{ xAxis: restValue }],
          },
        }],
      };
    }

    // Right chart: picked vs rest over time. For review volume: picked count and its share of all reviews.
    function trendOption (page, alias, kind, theme, name) {
      const toMap = (query) => new Map((query.result?.rows ?? []).map((row) => [String(row.period).slice(0, 10), row]));
      const mine = toMap(page.trendPick);
      const rest = toMap(page.trendRest);
      const periods = [...new Set([...mine.keys(), ...rest.keys()])].sort();
      const pickColor = theme.cat[0];
      const restColor = theme.cat[7];
      const base = {
        animation: false,
        textStyle: { color: theme.text },
        grid: { left: 8, right: 16, top: 24, bottom: 8, containLabel: true },
        xAxis: { type: 'category', data: periods, ...axisStyle(theme) },
      };
      if (kind === 'count') {
        const counts = periods.map((p) => num(mine.get(p)?.reviews) ?? 0);
        const shares = periods.map((p, i) => {
          const total = counts[i] + (num(rest.get(p)?.reviews) ?? 0);
          return total ? counts[i] / total : null;
        });
        return {
          ...base,
          tooltip: { trigger: 'axis' },
          yAxis: [
            { type: 'value', axisLabel: { color: theme.text }, splitLine: axisStyle(theme).splitLine },
            { type: 'value', axisLabel: { color: theme.text, formatter: (v) => fmt.pct.format(v) }, splitLine: { show: false } },
          ],
          series: [
            { name: `${name} reviews`, type: 'bar', itemStyle: { color: pickColor, opacity: 0.7 }, data: counts,
              tooltip: { valueFormatter: (v) => fmt.count.format(v) } },
            { name: 'Share of all reviews', type: 'line', yAxisIndex: 1, showSymbol: false, connectNulls: true,
              lineStyle: { color: restColor, width: 2 }, itemStyle: { color: restColor }, data: shares,
              tooltip: { valueFormatter: (v) => (v == null ? 'n/a' : fmt.pct.format(v)) } },
          ],
        };
      }
      // null (nothing rated that period) stays a gap, not a 0
      const series = (map) => periods.map((p) => num(map.get(p)?.[alias]));
      const valueAxis = kind === 'rating' ? { min: 0, max: 5 } : { min: 0, max: 1 };
      return {
        ...base,
        tooltip: { trigger: 'axis', valueFormatter: (v) => show(v, kind) },
        yAxis: { type: 'value', ...valueAxis, axisLabel: { color: theme.text, formatter: (v) => show(v, kind) }, splitLine: axisStyle(theme).splitLine },
        series: [
          { name, type: 'line', showSymbol: false, connectNulls: true, lineStyle: { color: pickColor, width: 2 }, itemStyle: { color: pickColor }, data: series(mine) },
          { name: `Rest of ${NOUN[page.group]}`, type: 'line', showSymbol: false, lineStyle: { color: restColor, width: 2, type: 'dashed' }, itemStyle: { color: restColor }, data: series(rest) },
        ],
      };
    }

    function renderPage (page, theme) {
      const name = picked[page.group];
      const mineRow = page.kpiPick.result?.rows[0] ?? {};
      const restRow = page.kpiRest.result?.rows[0] ?? {};
      page.queries.forEach(logFirstResult);
      renderKpis(page, mineRow, restRow);
      page.el.querySelectorAll('.legend-pick').forEach((el) => { el.textContent = name; });

      for (const [alias, , , kind] of page.sections) {
        const sectionEl = page.el.querySelector(`[data-anfra-block="${page.key}-${alias}"]`);
        const [text, dir] = deltaText(kind, num(mineRow[alias]), num(restRow[alias]));
        const summary = sectionEl.querySelector('[data-summary]');
        summary.textContent = `${name} ${show(num(mineRow[alias]), kind)} vs rest ${show(num(restRow[alias]), kind)}${text ? `  (${text})` : ''}`;
        summary.className = `caption delta ${dir}`;
        renderStatus([page.top, page.trendPick, page.trendRest], sectionEl.querySelector('.status'));
      }

      for (const { chart, kind: chartKind, alias } of page.charts ?? []) {
        const kind = page.kpis.find(([a]) => a === alias)[3];
        if (chartKind === 'top' && page.top.result) {
          chart.setOption(topOption(page, alias, kind, num(restRow[alias]), theme, name), { replaceMerge: ['series'] });
        } else if (chartKind === 'trend' && (page.trendPick.result || page.trendRest.result)) {
          chart.setOption(trendOption(page, alias, kind, theme, name), { replaceMerge: ['series', 'yAxis'] });
        }
      }
    }

    // Only the open tab draws; the others draw when they are opened.
    function render () {
      renderPage(currentPage(), chartTheme());
    }

    app.subscribe(render);
    darkQuery.addEventListener('change', () => { applyTheme(); render(); });

    // ---- Controls ----
    const pickers = {
      airline: { box: document.getElementById('airline-combobox'), list: document.getElementById('airline-listbox') },
      airport: { box: document.getElementById('airport-combobox'), list: document.getElementById('airport-listbox') },
    };
    const travellerBox = document.getElementById('traveller-combobox');
    const travellerList = document.getElementById('traveller-listbox');

    function fillOptions (list, values) {
      list.replaceChildren(...values.map((value) => {
        const option = document.createElement('div');
        option.setAttribute('role', 'option');
        option.dataset.value = String(value);
        option.textContent = String(value);
        return option;
      }));
    }

    // Basecoat initializes comboboxes on DOMContentLoaded, so wait for it before refresh().
    const domReady = document.readyState === 'loading'
      ? new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve))
      : Promise.resolve();
    const airlinePage = PAGES.find((p) => p.group === 'airline');
    const airportPage = PAGES.find((p) => p.group === 'airport');
    Promise.all([airlinePage.pickFilter.loadOptions(), airportPage.pickFilter.loadOptions(), travellerFilters[0].loadOptions(), domReady])
      .then(([airlines, airports, travellers]) => {
        for (const [group, values] of [['airline', airlines], ['airport', airports]]) {
          fillOptions(pickers[group].list, values);
          pickers[group].box.refresh();
          pickers[group].box.setValue?.(DEFAULTS[group]);
        }
        fillOptions(travellerList, travellers);
        travellerBox.refresh();
      }).catch((err) => console.error('Could not load filter options', err));

    for (const [group, { box }] of Object.entries(pickers)) {
      box.addEventListener('change', (event) => {
        const value = event.detail.value;
        if (typeof value === 'string' && value) setEntity(group, value);
      });
    }
    travellerBox.addEventListener('change', (event) => {
      const values = Array.isArray(event.detail.value) ? event.detail.value : [];
      for (const filter of travellerFilters) filter.setCondition({ operator: 'is', values });
      app.execute();
    });

    const fromInput = document.getElementById('date-from');
    const toInput = document.getElementById('date-to');
    function applyDateRange () {
      const condition = fromInput.value && toInput.value
        ? { operator: 'between', values: [fromInput.value, toInput.value] }
        : { operator: 'is', values: [] };
      for (const filter of dateFilters) filter.setCondition(condition);
      app.execute();
    }
    fromInput.addEventListener('change', applyDateRange);
    toInput.addEventListener('change', applyDateRange);
    document.querySelectorAll('[data-years]').forEach((button) => {
      button.addEventListener('click', () => {
        const years = button.dataset.years;
        if (years === 'all') {
          fromInput.value = '';
          toInput.value = '';
        } else {
          const today = new Date();
          const from = new Date(Date.UTC(today.getUTCFullYear() - Number(years), today.getUTCMonth(), today.getUTCDate()));
          fromInput.value = from.toISOString().slice(0, 10);
          toInput.value = today.toISOString().slice(0, 10);
        }
        applyDateRange();
      });
    });

    document.querySelectorAll('[data-grain]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-grain]').forEach((other) => {
          const on = other === button;
          other.dataset.variant = on ? 'secondary' : 'outline';
          other.setAttribute('aria-pressed', String(on));
        });
        grain.setGrain(button.dataset.grain);
        app.execute();
      });
    });

    window.addEventListener('resize', () => {
      currentPage().charts?.forEach(({ chart }) => chart.resize());
    });

    showPage(current);
    app.execute();
  </script>
</body>
</html>
