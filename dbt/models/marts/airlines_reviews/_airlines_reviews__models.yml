version: 2

models:
  - name: airlines_reviews__dim_airline
    description: "Airline dimension. Grain: one row per airline."
    columns:
      - name: airline_id
        description: Primary key - natural key from the source airline lookup.
        data_tests: [unique, not_null]
      - name: airline_name
        description: Airline name as published on Skytrax.
        data_tests: [not_null]
      - name: airline_name_cleaned
        description: Lowercased, trimmed name with trailing review-count artifacts stripped.
        data_tests: [not_null]

  - name: airlines_reviews__dim_customer
    description: "Customer dimension. Grain: one row per (customer_name, nationality)."
    columns:
      - name: customer_id
        description: Primary key - surrogate hash of (customer_name, nationality).
        data_tests: [unique, not_null]
      - name: customer_name
        description: Reviewer display name; 'unknown' when the source left it blank.
        data_tests: [not_null]
      - name: nationality
        description: Reviewer nationality; 'unknown' when the source left it blank.
        data_tests: [not_null]
      - name: number_of_reviews
        description: Count of airline reviews this reviewer submitted.
        data_tests: [not_null]
      - name: first_review_date
        description: Earliest date_submitted for this reviewer.
      - name: latest_review_date
        description: Latest date_submitted for this reviewer.

  - name: airlines_reviews__dim_location
    description: >
      Role-playing location dimension covering origin, destination and transit
      airports. Grain: one row per (city, airport).
    columns:
      - name: location_id
        description: Primary key - surrogate hash of (city, airport).
        data_tests: [unique, not_null]
      - name: city
        description: City name; 'unknown' when the source left it blank.
        data_tests: [not_null]
      - name: airport
        description: IATA airport code; 'unknown' when the source left it blank.
        data_tests: [not_null]

  - name: airlines_reviews__dim_aircraft
    description: "Aircraft dimension. Grain: one row per aircraft model string."
    columns:
      - name: aircraft_id
        description: Primary key - surrogate hash of aircraft_model.
        data_tests: [unique, not_null]
      - name: aircraft_model
        description: Free-text aircraft model from the review; 'unknown' when not stated.
        data_tests: [not_null]
      - name: aircraft_manufacturer
        description: Leading token of the model string, e.g. 'Boeing'.
        data_tests: [not_null]
      - name: seat_capacity
        description: Typical seat count of the matched aircraft family; null when unmatched.

  - name: airlines_reviews__dim_date
    description: "Calendar and fiscal date dimension. Grain: one row per day."
    columns:
      - name: date_id
        description: Primary key - the calendar date itself.
        data_tests: [unique, not_null]
      - name: is_weekend
        description: True for Saturday and Sunday.
        data_tests: [not_null]
      - name: fin_year
        description: Fiscal year, assuming a 1 July start.
        data_tests: [not_null]

  - name: airlines_reviews__fct_airline_review
    description: >
      Airline (flight) review fact. Grain: one row per review submission.
      Measures are the seven 1-5 category ratings plus the derived
      average_rating and rating_band.
    columns:
      - name: review_id
        description: Primary key - review identifier from the source.
        data_tests: [unique, not_null]
      - name: airline_id
        description: FK to dim_airline.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_airline')
                field: airline_id
      - name: customer_id
        description: FK to dim_customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_customer')
                field: customer_id
      - name: date_submitted_id
        description: FK to dim_date - date the review was submitted.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_date')
                field: date_id
      - name: date_flown_id
        description: FK to dim_date - date of the flight; null when not stated.
        data_tests:
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_date')
                field: date_id
      - name: origin_location_id
        description: FK to dim_location - departure airport.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_location')
                field: location_id
      - name: destination_location_id
        description: FK to dim_location - arrival airport.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_location')
                field: location_id
      - name: transit_location_id
        description: FK to dim_location - layover airport; resolves to 'unknown' for direct flights.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_location')
                field: location_id
      - name: aircraft_id
        description: FK to dim_aircraft.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('airlines_reviews__dim_aircraft')
                field: aircraft_id
      - name: is_verified
        description: Whether Skytrax marked the review as a verified trip.
      - name: seat_type
        description: "Cabin flown: Economy Class, Premium Economy, Business Class, First Class or unknown."
        data_tests: [not_null]
      - name: type_of_traveller
        description: "Trip type: Solo Leisure, Couple Leisure, Family Leisure, Business or unknown."
        data_tests: [not_null]
      - name: has_layover
        description: True when a transit airport was recorded.
        data_tests: [not_null]
      - name: seat_comfort
        data_tests: &rating_1_to_5
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: cabin_staff_service
        data_tests: *rating_1_to_5
      - name: food_and_beverages
        data_tests: *rating_1_to_5
      - name: inflight_entertainment
        data_tests: *rating_1_to_5
      - name: ground_service
        data_tests: *rating_1_to_5
      - name: wifi_and_connectivity
        data_tests: *rating_1_to_5
      - name: value_for_money
        data_tests: *rating_1_to_5
      - name: recommended
        description: Whether the reviewer would recommend the airline.
      - name: average_rating
        description: Mean of the category ratings actually scored; null when none were.
      - name: rating_band
        description: average_rating bucketed into bad (<2), medium (<4), good (>=4) or unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bad', 'medium', 'good', 'unknown']
      - name: review_text
        description: Free-text review body.
      - name: source_updated_at
        description: Source updated_at; the high-water mark driving incremental loads.
        data_tests: [not_null]
      - name: dbt_loaded_at
        description: Timestamp this row was last written by dbt.
        data_tests: [not_null]
