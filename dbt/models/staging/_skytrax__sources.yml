version: 2

sources:
  - name: skytrax_raw
    description: >
      CSV extracts written by download.py into data/raw/. dbt-duckdb reads them
      in place via read_csv - nothing is loaded into the database first.
    meta:
      external_location: "read_csv('{{ env_var('SKYTRAX_RAW_DIR', '../data/raw') }}/{name}.csv', header = true, sample_size = -1)"
    tables:
      - name: airline_reviews
        description: One row per flight review left on Skytrax.
      - name: airport_reviews
        description: One row per airport review left on Skytrax.
      - name: lounge_reviews
        description: One row per airport lounge review left on Skytrax.
      - name: seat_reviews
        description: One row per aircraft seat review left on Skytrax.
      - name: airlines
        description: Airline lookup - the airline_id referenced by every review table.
      - name: airports
        description: Airport lookup - the airport_id referenced by airport_reviews.
